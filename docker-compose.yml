services:
  postgres:
    image: postgres:17-alpine
    container_name: vtex-tools-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vtex_tools

      # melhora compatibilidade UTF-8
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vtex_tools"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    command:
      [
        "postgres",
        "-c", "shared_buffers=256MB",
        "-c", "max_connections=100",
        "-c", "effective_cache_size=1GB",
        "-c", "maintenance_work_mem=64MB",
        "-c", "wal_buffers=16MB"
      ]

volumes:
  postgres_data:
